# FleetBench public starter configuration.
#
# Point base_url at any OpenAI-compatible chat-completions endpoint. When using
# llama-swap, each model name below must exactly match a model key in its config.
# When using a single-model server, use the model id accepted by that endpoint.

base_url: http://127.0.0.1:8080/v1
api_key: none
output_dir: results

# This deadline includes cold model loading and the request itself. Large or
# reasoning-heavy models may need a longer value.
request_timeout: 1800
request_retries: 6
warmup_retries: 10

categories: [tools, agentic, compliance, applied, finance, coding, reasoning, math, longctx]

# full: exhaustive suite
# compact: 45-request legacy comparison panel
# calibrated: versioned methodology panel with uncertainty reporting
suite_profile: full

# Keep this at 1 for a single server slot or strict throughput comparisons.
# Independent non-long-context tasks can overlap when the endpoint has multiple
# slots. Long-context tasks remain serial to avoid multiplying KV-cache demand.
request_concurrency: 1

# Per-round response budget for virtual agent environments.
agent_max_tokens: 2048

# Context depths are approximate prompt-token targets. FleetBench skips depths
# that do not fit within a model's configured `ctx` value with answer headroom.
longctx_depths: [4096, 16384, 32768]
needle_positions: [0.25, 0.75]
hard_longctx_depths: [16384, 65536]
frontier_longctx_depths: [32768, 65536]

# Reasoning controls are architecture- and template-specific. `inherit` leaves
# the endpoint's behavior unchanged. Do not force thinking on or off until you
# have confirmed that the serving template honors the requested fields.
math_thinking: inherit
math_max_tokens: 8192

# Optional per-category controls:
# tools_thinking: inherit
# compliance_thinking: inherit
# applied_thinking: inherit
# finance_thinking: inherit
# coding_thinking: inherit
# reasoning_thinking: inherit
# agentic_thinking: inherit
#
# Optional total-output budgets when a category is forced on or off:
# tools_max_tokens: 4096
# applied_max_tokens: 4096
# reasoning_max_tokens: 12288
#
# Optional llama.cpp reasoning-only caps. These are examples, not universal
# recommendations; validate quality and truncation behavior for each model.
# coding_reasoning_budget: 10000
# reasoning_reasoning_budget: 5000
# finance_reasoning_budget: 5000
# agentic_reasoning_budget: 10000
# longctx_reasoning_budget: 5000
# math_reasoning_budget: 4096

seed: 1

models:
  # Replace this name with the exact model id accepted by your endpoint.
  - name: example-model
    ctx: 32768
    thinking: false

  # Example reasoning-model entry. Uncomment and customize only after checking
  # the model's chat template and the context actually served.
  # - name: example-reasoning-model
  #   ctx: 65536
  #   thinking: true
  #   thinking_multiplier: 8
  #   extra_body: {}
